<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMA 员工登录系统</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.85)), 
                        url('bg-login.jpg') center/cover no-repeat;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .login-box {
            background: rgba(10,10,10,0.95);
            padding: 50px 45px;
            border-radius: 12px;
            width: 420px;
            border: 2px solid #ff6600;
            box-shadow: 0 0 50px rgba(255,102,0,0.4);
            text-align: center;
        }
        .logo {
            height: 100px;
            margin-bottom: 25px;
        }
        h1 {
            margin-bottom: 35px;
            font-size: 1.85rem;
            letter-spacing: 2px;
        }
        input, .captcha-input {
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            background: #1a1a1a;
            border: 1px solid #555;
            border-radius: 6px;
            color: white;
            font-size: 1.05rem;
        }
        .captcha {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        button {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: #ff6600;
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #ff8533;
        }
        .back {
            display: block;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="logo.png" alt="IMA Logo" class="logo">
        <h1>员工登录系统</h1>
        
        <input type="text" placeholder="员工编号 / 用户名" id="user">
        <input type="password" placeholder="密码" id="pass">
        
        <div class="captcha">
            <input type="text" placeholder="验证码" class="captcha-input" maxlength="4">
            <img src="https://via.placeholder.com/130x48/222/ffffff?text=7X4K" alt="验证码">
        </div>

        <button onclick="login()">确认登录</button>
        
        <a href="index.html" class="back">← 返回官网首页</a>
    </div>

    <script>
        function login() {
            if (document.getElementById('user').value.trim() !== "") {
                alert("✅ 登录成功！\n\n欢迎回到岗位，IMA 矿工。\n\n（演示模式）");
                window.location.href = "index.html";
            } else {
                alert("请输入员工编号");
            }
        }
    </script>
</body>
</html>
